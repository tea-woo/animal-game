<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#07080d" />
<meta name="description" content="DRIFT LEGEND — 아이폰에서 터치로 즐기는 3D 드리프트 레이싱" />
<title>DRIFT LEGEND · 3D 드리프트 레이싱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
<link rel="stylesheet" href="./style.css?v=20261115a" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.169.0/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 레이싱 화면"></canvas>

  <!-- ── 로딩 ─────────────────────────────────────────── -->
  <div id="loading" class="screen overlay">
    <div class="load-box">
      <div class="logo">DRIFT<span>LEGEND</span></div>
      <div class="load-bar"><i id="load-fill"></i></div>
      <div class="load-text" id="load-text">서킷 준비 중…</div>
    </div>
  </div>

  <!-- ── 메뉴 / 차량 선택 ─────────────────────────────── -->
  <div id="menu" class="screen overlay hidden">
    <div class="menu-wrap">
      <header class="menu-head">
        <div class="logo">DRIFT<span>LEGEND</span></div>
        <p class="tagline">3랩 · 4대 경쟁 · 미니터보 드리프트</p>
      </header>

      <div class="cars" id="car-list"><!-- 카드 동적 생성 --></div>

      <div class="menu-actions">
        <button id="start-btn" class="btn primary">START<span>레이스 시작</span></button>
        <div class="menu-meta">
          <span id="best-lap">베스트 랩 —</span>
          <button id="mute-btn" class="icon-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
        </div>
      </div>

      <p class="hint-line">모바일: ◀ ▶ 조향 · DRIFT 길게 · BOOST 가속 &nbsp;|&nbsp; PC: ← → / A D · Space 드리프트 · Shift 부스트</p>
    </div>
  </div>

  <!-- ── HUD ───────────────────────────────────────────── -->
  <div id="hud" class="hidden" aria-hidden="true">
    <div class="hud-head">
      <div class="pill lap"><em>LAP</em><b id="lap-text">1/3</b></div>
      <div class="pill pos"><em>POS</em><b id="pos-text">1/4</b></div>
      <div class="timer">
        <b id="time-text">0:00.00</b>
        <span id="best-text">BEST --:--.--</span>
      </div>
      <canvas id="minimap" width="220" height="220" aria-label="미니맵"></canvas>
    </div>

    <div class="hud-center">
      <div id="countdown" class="hidden"></div>
      <div id="toast" class="hidden"></div>
    </div>

    <div class="hud-bottom">
      <div class="steer">
        <button class="pad" id="btn-left" type="button" aria-label="좌회전">◀</button>
        <button class="pad" id="btn-right" type="button" aria-label="우회전">▶</button>
      </div>

      <div class="cluster">
        <div class="drift-gauge">
          <span class="dg-label">DRIFT</span>
          <div class="dg-bar"><i id="drift-fill"></i></div>
          <div class="dg-level" id="drift-level">READY</div>
        </div>
        <div class="speedo">
          <svg viewBox="0 0 120 66" class="speedo-arc" aria-hidden="true">
            <path d="M10 60 A50 50 0 0 1 110 60" class="arc-bg" />
            <path d="M10 60 A50 50 0 0 1 110 60" class="arc-fill" id="arc-fill" />
          </svg>
          <b id="speed-text">0</b>
          <span>km/h</span>
        </div>
        <div class="nitro">
          <span>NITRO</span>
          <div class="nt-bar"><i id="nitro-fill"></i></div>
        </div>
      </div>

      <div class="pedals">
        <button class="act drift" id="btn-drift" type="button">DRIFT</button>
        <button class="act boost" id="btn-boost" type="button">BOOST</button>
      </div>
    </div>

    <button id="pause-btn" class="icon-btn pause" type="button" aria-label="일시정지">❚❚</button>
  </div>

  <!-- ── 일시정지 ─────────────────────────────────────── -->
  <div id="pause" class="screen overlay hidden">
    <div class="panel">
      <h2>PAUSED</h2>
      <button class="btn primary" id="resume-btn">계속하기</button>
      <button class="btn" id="restart-btn">다시 시작</button>
      <button class="btn" id="garage-btn">차량 변경</button>
    </div>
  </div>

  <!-- ── 결과 ─────────────────────────────────────────── -->
  <div id="result" class="screen overlay hidden">
    <div class="panel wide">
      <h2 id="result-title">FINISH</h2>
      <div class="result-grid">
        <div><em>순위</em><b id="r-pos">1위</b></div>
        <div><em>총 기록</em><b id="r-total">0:00.00</b></div>
        <div><em>베스트 랩</em><b id="r-best">0:00.00</b></div>
        <div><em>최고 속도</em><b id="r-speed">0 km/h</b></div>
      </div>
      <div class="result-btns">
        <button class="btn primary" id="again-btn">한 번 더</button>
        <button class="btn" id="result-garage">차량 변경</button>
      </div>
    </div>
  </div>

  <div id="fatal" class="screen overlay hidden">
    <div class="panel">
      <h2>오류</h2>
      <pre id="fatal-text"></pre>
    </div>
  </div>
</div>

<script type="module">
  const fail = (msg) => {
    const el = document.getElementById('fatal');
    const t = document.getElementById('fatal-text');
    if (t) t.textContent = String(msg);
    if (el) el.classList.remove('hidden');
    const l = document.getElementById('loading');
    if (l) l.classList.add('hidden');
  };
  window.addEventListener('error', (e) => { if (!window.__driftReady) fail(e.message || e.error); });
  import('./src/main.js?v=20261115a').catch((err) => fail(err && (err.stack || err.message) || err));
</script>
</body>
</html>
